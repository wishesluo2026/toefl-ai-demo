<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="新托福写作 AI 训练与评分平台交互演示，展示学习闭环、AI 评分、成本控制与 Human-in-the-loop 人工校准机制。"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#5b21b6" />
    <title>新托福写作 AI 训练与评分平台 · 产品演示</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="#overview" aria-label="返回演示首页">
        <span class="brand-mark">W</span>
        <span>
          <strong>Writing Lab</strong>
          <small>Product Demo</small>
        </span>
      </a>
      <div class="header-badges" aria-label="演示环境状态">
        <span class="status-pill status-pill--safe">安全演示环境</span>
        <span class="status-pill">模拟数据</span>
        <button class="ghost-button" type="button" data-action="reset">
          重置演示
        </button>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="演示导航">
        <div class="sidebar-label">产品体验路线</div>
        <nav id="primary-nav"></nav>
        <div class="sidebar-note">
          <span class="note-dot"></span>
          <div>
            <strong>浏览器本地运行</strong>
            <p>不登录、不上传、不调用任何外部 API。</p>
          </div>
        </div>
      </aside>

      <main id="app" tabindex="-1"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">
        此交互演示需要浏览器启用 JavaScript，但不会连接任何外部服务。
      </div>
    </noscript>

    <script src="./app.js" defer></script>
  </body>
</html>
