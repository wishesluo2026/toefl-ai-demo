name: Validate career portfolio preview

on:
  push:
    branches: ["feature/career-portfolio-v2-20261014"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate script syntax
        run: node --check app.js
      - name: Verify zero-network and portfolio contracts
        run: npm run check
